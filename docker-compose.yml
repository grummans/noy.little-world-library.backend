# Staging stack for server 192.168.1.48.
#
# Public entry points (Nginx Proxy Manager on .102 routes these to the host ports):
#   https://staging-littleworld.duckdns.org        -> web   (WEB_PORT, SPA)
#   https://staging-littleworld.duckdns.org/api/   -> api   (API_PORT, same-origin API)
#   https://media-staging-littleworld.duckdns.org  -> existing MinIO on .48:9000 (presigned GETs)
#
# Secrets come from .env next to this file (see .env.staging.example, chmod 600).
# PostgreSQL stays on the internal network; the existing MinIO is reached through the host LAN IP.

name: little-world-staging

x-api-env: &api-env
  APP_ENV: staging
  HTTP_ADDR: ":8080"
  # Built from POSTGRES_* so the password is written once, in .env.
  DATABASE_URL: postgres://${POSTGRES_USER:-little_world}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-little_world_staging}?sslmode=disable
  # Internal endpoint for API calls; the public endpoint is only used for signing, because
  # the signature covers the Host the browser will use.
  S3_ENDPOINT: ${S3_ENDPOINT:-http://192.168.1.48:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://media-staging-littleworld.duckdns.org}
  S3_BUCKET: ${S3_BUCKET:-little-world-staging}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}

services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    env_file: .env
    environment: *api-env
    ports:
      - "${API_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot migration runner: `docker compose --profile tools run --rm migrate up`.
  migrate:
    profiles: ["tools"]
    image: ${API_IMAGE:?API_IMAGE is required}
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["status"]
    env_file: .env
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20


  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8082}:80"

volumes:
  postgres-data:
